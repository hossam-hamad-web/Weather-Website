<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wether App</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">
        <div class="wether">
            <div class="temp">
                <p>30°C</p>
            </div>

            <div class="loc_time">
                <p class="city">Cairo</p>
                <p class="time_date">3:35 Wensday 2025-4-30</p>
            </div>

            <div class="cond">
                <p>Partly cloudy</p>
            </div>
        </div>

        <nav>
            <form action="">
                <input type="text" placeholder="Search about your city" name="" id="" class="search" />
                <button type="submit" class="sub">Search</button>
            </form>
        </nav>
    </div>
    <script src="../js/script.js">
    </script>
</body>

</html>
